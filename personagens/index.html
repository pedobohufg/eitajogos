<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
/* EITA! Personagens — biblioteca paramétrica no estilo "boneco de vinil" definido pelos frames de referência.
   Esqueleto compatível com o EITA! Calçada: root, legs[{hip,knee}], arms[{sh,el,hd}], torso, head, hipY, type.
   Peças combináveis: corpo (mulher, homem, criança, idoso, idosa), parte de cima, parte de baixo, calçado,
   cabelo (recorte do rosto feito no shader), barba, rosto e acessórios.
   EITA.REF tem os 7 personagens dos frames; EITA.spec(tipo) sorteia variações para o jogo. */
function eitaPeople(THREE, OPT = {}) {
  const Q = OPT.lite ? .62 : 1, QN = OPT.lite ? 1 : 0; /* modo leve: menos segmentos (VR/jogo) */
  const V2 = (x, y) => new THREE.Vector2(x, y), V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  let R = Math.random; const pk = a => a[Math.floor(R() * a.length)], rr = (a, b) => a + R() * (b - a), ch = p => R() < p;
  const MC = {}; const M = c => MC[c] || (MC[c] = new THREE.MeshStandardMaterial({ color: c, roughness: .8, metalness: 0 }));
  const sm = (pts, n = 3) => new THREE.SplineCurve(pts.map(p => V2(p[0], p[1]))).getPoints(Math.max(6, pts.length * Math.max(2, n - QN)));
  const mesh = (geo, m) => { const o = new THREE.Mesh(geo, m); o.castShadow = true; return o; };
  function seamFix(g, seg) { const n = g.attributes.normal, np = n.count / (seg + 1), v = new THREE.Vector3(), w = new THREE.Vector3();
    for (let j = 0; j < np; j++) { const a = j, b = seg * np + j; v.fromBufferAttribute(n, a); w.fromBufferAttribute(n, b); v.add(w).normalize(); n.setXYZ(a, v.x, v.y, v.z); n.setXYZ(b, v.x, v.y, v.z); } }
  function latheG(pts, seg = 24) { return new THREE.LatheGeometry(pts, Math.max(10, Math.round(seg * Q)), Math.PI); } /* costura atrás */
  const lathe = (pts, m, seg = 24) => mesh(latheG(pts, seg), m);
  const GC = {};
  function capG(r1, r2, len, seg = OPT.lite ? 9 : 12) { const k = [r1, r2, len, seg].map(v => (+v).toFixed(4)).join('|'); if (GC[k]) return GC[k];
    const p = [], n = 4; for (let i = 0; i <= n; i++) { const a = i / n * Math.PI / 2; p.push(V2(Math.sin(a) * r2, -len - Math.cos(a) * r2)); }

  const cap = (r1, r2, len, m, seg) => mesh(capG(r1, r2, len, seg), m);
  const SG = { hi: OPT.lite ? new THREE.SphereGeometry(1, 12, 9) : new THREE.SphereGeometry(1, 16, 12), lo: OPT.lite ? new THREE.SphereGeometry(1, 8, 6) : new THREE.SphereGeometry(1, 10, 7) }; SG.hi.userData.shared = SG.lo.userData.shared = true;
  const ell = (rx, ry, rz, m, lo) => { const o = mesh(lo ? SG.lo : SG.hi, m); o.scale.set(rx, ry, rz); return o; };
  const tubeOpen = (r1, r2, len, m, seg = 12) => { const o = mesh(new THREE.CylinderGeometry(r1, r2, len, seg, 1, true), m); o.position.y = -len / 2; return o; };

  /* ---------- texturas de tecido ---------- */

      for (let i = 0; i < 22; i++) { const fx = r() * 256, fy = r() * 256, rad = 9 + r() * 10, col = r() < .75 ? hex(c2 ?? 0xf6efe2) : 'rgba(255,255,255,.55)'; for (const [ox, oy] of [[0, 0], [256, 0], [-256, 0], [0, 256], [0, -256]]) fl(fx + ox, fy + oy, rad, col, '#e3cfa8'); } }
    if (kind === 'dots') for (let i = 0; i < 900; i++) { x.fillStyle = r() < .55 ? hex(c2) : 'rgba(255,255,255,.7)'; x.beginPath(); x.arc(r() * 256, r() * 256, .7 + r() * 1.5, 0, 7); x.fill(); }
    if (kind === 'denim') { for (let i = 0; i < 256; i += 2) { x.fillStyle = `rgba(255,255,255,${.03 + r() * .06})`; x.fillRect(0, i, 256, 1); } for (let i = 0; i < 2500; i++) { x.fillStyle = `rgba(0,0,0,${r() * .1})`; x.fillRect(r() * 256, r() * 256, 3, 1); } }
    if (kind === 'xadrez') { x.globalAlpha = .35; x.fillStyle = hex(c2); for (let i = 0; i < 256; i += 32) { x.fillRect(i, 0, 12, 256); x.fillRect(0, i, 256, 12); } x.globalAlpha = 1; }
    const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.repeat.set(3, 2); t.anisotropy = 4; return TX[k] = t; }

  /* ---------- tecido: cor lisa (mesclável) ou material com listras / estampa / recortes no shader ---------- */
  const CM = {};
  function cloth(o) {
    if (typeof o === 'number') return M(o);
    if (!o.str && !o.open && !o.tex && !o.neck && !o.v && !o.arm) return M(o.c);
    const key = JSON.stringify(o); if (CM[key]) return CM[key];
    const m = new THREE.MeshStandardMaterial({ color: o.tex ? 0xffffff : o.c, roughness: .86, metalness: 0, side: THREE.DoubleSide, map: o.tex ? tex(o.tex, o.c, o.c2) : null });
    const U = { uStr: { value: V3(o.str ? o.str[0] : 0, o.str ? o.str[1] : 0, 0) }, uStrC: { value: new THREE.Color(o.str ? o.str[2] : (o.v ? o.v[2] : 0)) },
      uV: { value: V2(o.v ? o.v[0] : -1, o.v ? o.v[1] : 0) }, uOpen: { value: V2(o.open ? o.open[0] : 0, o.open ? o.open[1] : 9) }, uNk: { value: new THREE.Vector4(...(o.neck ? [o.neck[0], o.neck[1], o.neck[2], o.neck[3] ?? 1] : [9, 0, 1, 1])) }, uNkB: { value: o.neck && o.neck[4] != null ? o.neck[4] : 9 },

    m.onBeforeCompile = sh => { Object.assign(sh.uniforms, U);
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vCL;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvCL = position;');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vCL; uniform vec3 uStr; uniform vec3 uStrC; uniform vec2 uV; uniform vec2 uOpen; uniform vec4 uNk; uniform float uNkB; uniform vec2 uArm; uniform vec2 uSr;')
        .replace('void main() {', `void main() {
          if (uOpen.x > 0. && vCL.z > 0. && abs(vCL.x) < uOpen.x && vCL.y < uOpen.y) discard;
          float nu = pow(clamp(abs(vCL.x) / uNk.z, 0., 1.), uNk.w);
          if (vCL.y > (vCL.z > 0. ? uNk.x : uNkB) + uNk.y * nu) discard;

        .replace('#include <color_fragment>', `#include <color_fragment>
          if (uStr.x > 0. && vCL.y > uSr.x && vCL.y < uSr.y && fract(vCL.y / uStr.x) < uStr.y) diffuseColor.rgb = uStrC;
          if (uV.x > 0. && vCL.z > 0. && abs(abs(vCL.x) - uV.x) < uV.y) diffuseColor.rgb = uStrC;

  /* ---------- cabelo e barba: superfície única com recorte do rosto no shader (sem degraus na borda) ---------- */
  const HAIR_FRAG = `float ang = atan(vHL.x, vHL.z);
    float hl = uF.x + uF.y * clamp(vHL.x / .13, -1., 1.) - uF.z * max(0., 1. - abs(vHL.x) / .06) - uF.w * min(1., vHL.x * vHL.x / .0196);
    float lim = vHL.y > .03 ? uL.x - (vHL.y - .03) * 1.6 : uL.y + (uL.x - uL.y) * clamp((vHL.y + .06) / .09, 0., 1.);
    if (abs(ang) < lim && vHL.y < hl) discard;
    if (vHL.y > uT) discard;
    if (vHL.y < mix(uB.x, uB.y, smoothstep(1.2, 2.4, abs(ang)))) discard;`;
  const BEARD_FRAG = `float ang = atan(vHL.x, vHL.z);
    if (abs(ang) > uBd.x) discard;
    if (vHL.y > uBd.y + uBd.z * smoothstep(.12, 1.1, abs(ang))) discard;`;
  function cutMats(color, frag, uni, key, c2, c2y) {
    const inj = (sh, col) => { Object.assign(sh.uniforms, uni);
      const decl = '\nvarying vec3 vHL; uniform vec4 uF; uniform vec2 uL; uniform float uT; uniform vec2 uB; uniform vec3 uBd; uniform vec3 uC2; uniform float uC2y;';
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vHL;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvHL = position;');

      if (col) sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
        if (uC2y > -1.) diffuseColor.rgb = mix(diffuseColor.rgb, uC2, clamp((uC2y - vHL.y) / .05, 0., 1.));
        if (!gl_FrontFacing) diffuseColor.rgb *= .72;`); };

      const n = Math.sin(v.x * f) * Math.sin(v.y * f * 1.1 + 1.3) * Math.sin(v.z * f * .95 + .7) + .5 * Math.sin(v.x * f * 2.3 + 2) * Math.sin(v.y * f * 2.1) * Math.sin(v.z * f * 1.9 + 1);

  const HAIR = {
    chanel: { p: [[.125, -.085], [.15, -.1], [.177, -.082], [.19, -.035], [.191, .025], [.182, .09], [.162, .155], [.128, .21], [.075, .25], [0, .265]], F: [.14, .026, .014], L: [1.22, 1.04], B: [-9, -9] },
    longo: { p: [[.12, -.3], [.15, -.27], [.168, -.19], [.18, -.1], [.187, -.02], [.186, .06], [.176, .13], [.152, .19], [.11, .235], [.06, .258], [0, .266]], F: [.15, .02, .01], L: [1.2, 1.0], B: [-9, -9] },
    tigela: { p: [[.135, .02], [.157, .015], [.164, .06], [.164, .12], [.154, .18], [.124, .228], [.073, .258], [0, .272]], F: [.128, .012, 0, .02], L: [1.3, 1.3], B: [.035, -.02] },
    lateral: { p: [[.135, -.04], [.153, -.025], [.16, .04], [.161, .11], [.153, .18], [.126, .232], [.08, .262], [0, .275]], F: [.168, .018, 0, .03], L: [1.32, 1.32], B: [.075, -.03], topete: 1 },
    curto: { p: [[.138, -.03], [.15, -.02], [.154, .05], [.154, .12], [.144, .18], [.114, .23], [.069, .256], [0, .264]], F: [.172, 0, 0, .03], L: [1.35, 1.35], B: [.07, -.03] },
    crespo: { p: [[.138, -.03], [.155, -.02], [.164, .05], [.167, .13], [.158, .2], [.128, .252], [.074, .281], [0, .291]], F: [.176, 0, 0, .035], L: [1.36, 1.36], B: [.065, -.02], bump: [.011, 78] },
    nuvem: { p: [[.13, -.01], [.168, -.01], [.197, .04], [.207, .11], [.201, .18], [.171, .245], [.106, .289], [0, .303]], F: [.163, 0, 0, .05], L: [1.22, 1.15], B: [.015, -.03], bump: [.016, 60] },
    black: { p: [[.13, -.05], [.185, -.05], [.22, .02], [.234, .11], [.228, .2], [.195, .272], [.123, .318], [0, .333]], F: [.16, 0, 0, .05], L: [1.22, 1.1], B: [-.01, -.05], bump: [.016, 55] },
    calvo: { p: [[.143, -.035], [.155, -.02], [.161, .04], [.16, .1], [.153, .14]], F: [.4, 0, 0], L: [1.5, 1.5], B: [.035, -.035], T: .128 },
    rabo: { p: [[.138, -.04], [.15, -.03], [.155, .05], [.156, .12], [.146, .18], [.116, .23], [.07, .257], [0, .266]], F: [.165, .01, 0, .035], L: [1.3, 1.3], B: [.05, -.04], rabo: 1 },
    coque: { p: [[.138, -.04], [.15, -.03], [.155, .05], [.156, .12], [.146, .18], [.116, .23], [.07, .257], [0, .266]], F: [.165, 0, 0, .035], L: [1.3, 1.3], B: [.05, -.04], coque: 1 },

  const BODY = {

      T: sc([[.122, -.04], [.12, .1], [.118, .22], [.126, .34], [.134, .42], [.134, .47], [.115, .51], [.08, .54], [.048, .565], [.038, .58]], 1.13, 1.1), foot: [.045, .034, .105], sk: SKM },

      T: sc([[.084, -.03], [.08, .06], [.078, .14], [.082, .22], [.082, .26], [.068, .29], [.045, .31], [.028, .325]], 1.28, 1.2), foot: [.036, .027, .068], sk: SKF },

  BODY.idoso = Object.assign({}, BODY.homem, { hipY: .68, tl: .41, shY: .49, headY: .68, hs: 1.08, rT: .072, rK: .056, ra: .044, shX: .16, legX: .074,
    T: sc([[.13, -.04], [.133, .1], [.136, .22], [.135, .34], [.135, .42], [.132, .46], [.112, .5], [.078, .53], [.047, .555], [.038, .57]], 1.2, 1.15) });
  BODY.idosa = Object.assign({}, BODY.mulher, { hipY: .6, tl: .37, shX: .14, hs: 1.08, rT: .07, rK: .055, rA: .036, ra: .04, legX: .07,
    T: sc([[.128, -.04], [.122, .1], [.114, .2], [.118, .3], [.12, .38], [.12, .43], [.108, .47], [.076, .51], [.045, .545], [.033, .56]], 1.28, 1.2) });

  /* ================= construtor ================= */
  function make(S) {
    const B0 = BODY[S.body], w = S.w || 1, B = Object.assign({}, B0, { T: B0.T.map(([r, y]) => [r * w, y]), shX: B0.shX * Math.sqrt(w), rT: B0.rT * Math.sqrt(w), legX: B0.legX * Math.sqrt(w) });
    const Tr = y => interp(B.T, y);
    const skin = M(S.skin), g = new THREE.Group(), root = new THREE.Group(); g.add(root);
    const hipY = B.hipY, kneeAbs = hipY - B.tl, ftR = B.foot;
    const top = S.top, bot = S.bottom || { k: 'nenhum' }, dress = top.k === 'vestido';
    const botM = bot.c != null ? cloth(bot.c) : null;
    /* ---- pernas ---- */
    const legs = [-1, 1].map(s => {
      const hip = new THREE.Group(); hip.position.set(s * B.legX, hipY, 0); root.add(hip);
      const knee = new THREE.Group(); knee.position.y = -B.tl; hip.add(knee);
